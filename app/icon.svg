<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favicon-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8A2BE2" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="favicon-plat" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="favicon-cyan" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Dark Base Squircle -->
  <rect width="64" height="64" rx="16" fill="#05070D"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#favicon-border)" stroke-width="1.5"/>

  <!-- Minimal Royal Coronet Diamond -->
  <polygon points="32,7 34.5,10.5 32,14 29.5,10.5" fill="url(#favicon-cyan)"/>
  <circle cx="23" cy="12" r="1.2" fill="#00F0FF"/>
  <circle cx="41" cy="12" r="1.2" fill="#38BDF8"/>
  <path d="M21 16L23 13L27.5 15.5L32 11L36.5 15.5L41 13L43 16Z" fill="url(#favicon-plat)"/>

  <!-- Interconnected PR Monogram -->
  <!-- P Stem -->
  <path d="M16 18H21V48H16Z" fill="url(#favicon-plat)"/>
  <!-- P Bowl -->
  <path d="M21 18H31C35.5 18 38.5 21 38.5 26C38.5 31 35.5 34 31 34H21V18Z" fill="url(#favicon-plat)"/>
  <path d="M21 22.5H30C32.5 22.5 34 24 34 26C34 28 32.5 29.5 30 29.5H21V22.5Z" fill="#05070D"/>

  <!-- R Stem (Interlocking) -->
  <path d="M30 18H35V48H30Z" fill="url(#favicon-plat)"/>
  <!-- R Bowl -->
  <path d="M35 18H44C48 18 51 21 51 25.5C51 30 48 33 44 33H35V18Z" fill="url(#favicon-plat)"/>
  <path d="M35 22.5H43C45 22.5 46.5 23.8 46.5 25.5C46.5 27.2 45 28.5 43 28.5H35V22.5Z" fill="#05070D"/>
  <!-- R Stride Leg -->
  <path d="M36.5 32H42L49 46.5H52V48H46.5L40 34H36.5V32Z" fill="url(#favicon-plat)"/>
  <path d="M41.5 34L48 46.5H50L43.5 34Z" fill="url(#favicon-cyan)"/>
  <!-- Interlocking Cyan Bridge -->
  <path d="M21 26H30V27.5H21Z" fill="url(#favicon-cyan)"/>
</svg>
