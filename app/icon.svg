<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ambient Cybernetic Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1f38" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#05070d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Platinum Gradients -->
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="265" r="210" fill="url(#cyanCore)"/>

  <!-- Neon Orbital Ring -->
  <ellipse cx="256" cy="275" rx="195" ry="155" fill="none" stroke="url(#cyanAccent)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="320 90 200 60" transform="rotate(-22 256 275)" filter="url(#neonGlow)"/>

  <!-- Royal Crown Detail -->
  <g transform="translate(256, 115)">
    <!-- Base Crown Band -->
    <path d="M-85,25 Q0,32 85,25 L75,34 Q0,40 -75,34 Z" fill="url(#silverPlate)"/>
    <!-- Crown Spikes -->
    <path d="M-85,25 L-70,-15 L-35,15 L0,-38 L35,15 L70,-15 L85,25 Q0,32 -85,25 Z" fill="url(#silverPlate)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Center Diamond Crest -->
    <polygon points="0,-18 10,-4 0,10 -10,-4" fill="#00F0FF" filter="url(#neonGlow)"/>
    <circle cx="-70" cy="-15" r="3.5" fill="#FFFFFF"/>
    <circle cx="0" cy="-38" r="4.5" fill="#FFFFFF"/>
    <circle cx="70" cy="-15" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Monogram PR Letterforms -->
  <g transform="translate(256, 280)" fill="url(#silverPlate)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.6))">
    <!-- P Letterform -->
    <path d="M-110,-115 L-40,-115 Q15,-115 15,-65 Q15,-15 -40,-15 L-65,-15 L-65,115 L-110,115 Z M-65,-70 L-40,-70 Q-15,-70 -15,-65 Q-15,-60 -40,-60 L-65,-60 Z" />
    
    <!-- Intertwined R Letterform with Sweeping Leg -->
    <path d="M-30,-50 L35,-50 Q90,-50 90,0 Q90,35 60,45 L115,115 L65,115 L15,50 L-30,50 L-30,-50 Z M15,-10 L35,-10 Q50,-10 50,0 Q50,10 35,10 L15,10 Z" />

    <!-- Center Cyber Serif Connector -->
    <path d="M-65, -15 L15, 10 L-10, 25 Z" fill="#00F0FF" opacity="0.6"/>
  </g>
</svg>
